.tx{fill:#1f2328}.tx2{fill:#59636e}
.pb{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tb{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.ts{fill:#0F6E56}
.gb{fill:#F1EFE8;stroke:#5F5E5A}.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
