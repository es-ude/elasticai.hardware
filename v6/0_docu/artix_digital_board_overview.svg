<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Artix-7 digital board block diagram</title>
<desc>An XC7A100T FPGA is configured and controlled by an RPi Pico, with FT230X USB-UART, JTAG header and ESP32-C3 module. DDR3, Gigabit Ethernet, configuration flash and ADC/PLL/RF interface connectors surround the FPGA; LTC3569, TPS51200 and LM3881 supply and sequence the rails.</desc>
