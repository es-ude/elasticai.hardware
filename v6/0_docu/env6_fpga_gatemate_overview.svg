<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>ENv6 FPGA board with CologneChip GateMate M1A1</title>
<desc>Block diagram: GateMate CCGM1A1 with configuration flash, DIP switches, level shifters and 100 MHz oscillator on the ENv6 connector.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.tx{fill:#1f2328}.tx2{fill:#59636e}
.pb{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tb{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.ts{fill:#0F6E56}
.gb{fill:#F1EFE8;stroke:#5F5E5A}.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
.ls{stroke:#378ADD}.lc{stroke:#4C9A2A}.la{stroke:#BA7517}
.ds{fill:#378ADD}.da{fill:#BA7517}
.ms{stroke:#378ADD}.mc{stroke:#4C9A2A}.ma{stroke:#BA7517}
