<text class="tx2" x="333" y="172" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">GP2–GP9</text>
<path class="lc" d="M257 220 H408" fill="none" stroke-width="2" marker-start="url(#mc)" marker-end="url(#mc)"/>
