<path class="ls" d="M40 300 H70" stroke-width="2.5"/>
<text class="tx2" x="78" y="300" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Data bus</text>
<path class="lc" d="M170 300 H200" stroke-width="2"/>
<text class="tx2" x="208" y="300" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Control / detection line</text>
<path class="la" d="M380 300 H410" stroke-width="2.5"/>
<text class="tx2" x="418" y="300" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Power</text>
