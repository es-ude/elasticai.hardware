<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>ENv6 adapter for Nordic PPK2</title>
<desc>The PPK2 adapter application board connects the supply rails of the ENv6 stack to the PPK2 connectors and identifies itself with a 1 kOhm resistor.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.tx{fill:#1f2328}.tx2{fill:#59636e}
.pb{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tb{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.ts{fill:#0F6E56}
.gb{fill:#F1EFE8;stroke:#5F5E5A}.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
.ls{stroke:#378ADD}.lc{stroke:#4C9A2A}.la{stroke:#BA7517}
.ds{fill:#378ADD}.da{fill:#BA7517}
.ms{stroke:#378ADD}.mc{stroke:#4C9A2A}.ma{stroke:#BA7517}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.tx{fill:#e6edf3}.tx2{fill:#9da7b3}
.pb{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#EEEDFE}.ps{fill:#CECBF6}
.tb{fill:#085041;stroke:#5DCAA5}.tt{fill:#E1F5EE}.ts{fill:#9FE1CB}
.gb{fill:#2f2f2d;stroke:#B4B2A9}.gt{fill:#F1EFE8}.gs{fill:#D3D1C7}
.ls{stroke:#85B7EB}.lc{stroke:#97C459}.la{stroke:#EF9F27}
.ds{fill:#85B7EB}.da{fill:#EF9F27}
.ms{stroke:#85B7EB}.mc{stroke:#97C459}.ma{stroke:#EF9F27}
}
</style>
<defs>
<marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ms" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ma" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mc" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="679" height="379" rx="10" stroke-width="1"/>
<rect class="gb" x="40" y="50" width="130" height="190" rx="10" stroke-width="0.75"/>
<text class="gt" x="105.0" y="145.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">ENv6 connector</text>
<text class="gs" x="105.0" y="163.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">power header</text>
<text class="gs" x="105.0" y="179.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">application header</text>
<rect class="gb" x="300" y="50" width="180" height="120" rx="10" stroke-width="0.75"/>
<text class="gt" x="390.0" y="110.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">PPK2 connectors</text>
<text class="gs" x="390.0" y="128.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">PPK2_CON</text>
<rect class="gb" x="540" y="50" width="110" height="120" rx="10" stroke-width="0.75"/>
<text class="gt" x="595.0" y="110.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Nordic PPK2</text>
<text class="gs" x="595.0" y="128.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">power profiler</text>
