<text class="tx" x="235" y="100" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Supply rails</text>
<text class="tx2" x="235" y="122" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">PSU1–4</text>
